name: ci
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/local
      - uses: yoshiki0705/example-own/.github/actions/x@main
      - uses: Yoshiki0705/FSx-for-ONTAP-Adoption-Playbook/.github/workflows/gate.yml@supply-chain-v1.0.0
      - uses: docker://ghcr.io/example/tool@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - run: docker run --rm -e A=b -v /tmp:/tmp ghcr.io/example/tool:1.2.3@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --help
      - run: syft scan dir:. -o spdx-json  # tool pinned elsewhere
      - run: pip install trivy==0.50.0
