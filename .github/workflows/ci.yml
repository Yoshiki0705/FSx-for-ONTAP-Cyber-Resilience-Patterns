name: CI - Lint & Test

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'solutions/**'
      - 'shared/**'
      - 'tests/**'
      - 'security/guard-rules/**'
      - 'requirements*.txt'
      - '.cfnlintrc'
      - '.github/workflows/ci.yml'
      # The evidence gate reads tracked markdown. Without these, a documentation-only
      # pull request skipped the whole job, so the one change the gate exists to catch
      # -- a new claim of vendor absence in a document -- was the change it never saw.
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'solutions/**'
      - 'shared/**'
      - 'tests/**'
      - 'security/guard-rules/**'
      - 'requirements*.txt'
      - '.cfnlintrc'
      - '.github/workflows/ci.yml'
      # The evidence gate reads tracked markdown. Without these, a documentation-only
      # pull request skipped the whole job, so the one change the gate exists to catch
      # -- a new claim of vendor absence in a document -- was the change it never saw.
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run cfn-lint
        # `make lint` is the one definition of the template list and of the exit-code rule
        # (cfn-lint exits 4/8 for warnings/informational findings, which pass; any run with the
        # error bit set, such as exit 2, fails). Calling cfn-lint directly here failed on W1011 in
        # shared/templates/demo-ad-environment.yaml, which `make test` already tolerated.
        # CI has no .venv, so VENV points make at the directory pip installed cfn-lint into.
        run: make lint VENV="$(dirname "$(command -v cfn-lint)")"

      # The binary, not the Node action: aws-cloudformation/cloudformation-guard action-v0.0.5
      # runs a 3.1.1 wasm build, ignores `show-summary` (it is not an input), and stayed green
      # while the rule files did not parse. A pinned binary also serves tests/test_guard_rules.py,
      # which needs cfn-guard on PATH. The sha256 is the `digest` GitHub reports for the 3.2.0
      # release asset (gh api repos/aws-cloudformation/cloudformation-guard/releases/tags/3.2.0).
      - name: Install cfn-guard 3.2.0 (sha256 checked)
        env:
          CFN_GUARD_ASSET: cfn-guard-v3-x86_64-ubuntu-latest
          CFN_GUARD_SHA256: 9f8c4d9f15f7dd54a37ea70a5237ba00aba682fb1e6521a744d12259961dfc13
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cfn-guard.tar.gz" \
            "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.0/${CFN_GUARD_ASSET}.tar.gz"
          echo "${CFN_GUARD_SHA256}  $RUNNER_TEMP/cfn-guard.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/cfn-guard-bin"
          tar -xzf "$RUNNER_TEMP/cfn-guard.tar.gz" -C "$RUNNER_TEMP/cfn-guard-bin" --strip-components=1 "${CFN_GUARD_ASSET}/cfn-guard"
          echo "$RUNNER_TEMP/cfn-guard-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cfn-guard-bin/cfn-guard" --version
      # Same recipe as local: three template globs, every template evaluated, non-zero if any
      # fails. The summary line prints how many templates were evaluated.
      - name: Run cfn-guard
        run: make guard
      # Findings recorded in templates/.checkov.baseline pass; a new finding fails the job.
      # Checkov comes from requirements-dev.txt, the same pin that `make security` uses.
      - name: Run Checkov (CloudFormation, baseline)
        run: checkov -d templates/ --framework cloudformation --quiet --baseline templates/.checkov.baseline

      - name: Run ruff (Python linter)
        run: |
          ruff check solutions/ tests/ shared/ --output-format=github

      # The ai-style gate was wired into `make test`, but CI runs its checks as discrete
      # steps and never invokes `make test`, so the gate never executed on a pull request.
      # A gate that cannot fail is no gate. This runs the detector the way `make ai-style`
      # does (--fail on D1/D2/D5/D14), with its own selftest first so a checker that reports
      # success without evaluating its rules is caught. The detector is stdlib-only, so it
      # runs under system python3 directly rather than through make, which would pull in
      # heavier security tooling.
      - name: AI writing-style gate (fail-tier)
        run: |
          python3 tools/ai_style_rules.py --selftest
          python3 tools/ai_style_rules.py docs/ --exclude 'articles/*' --fail

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r solutions/ -f json -o bandit-results.json || true

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --output json || true

      - name: Validate Lambda packaging
        run: |
          ./scripts/package-lambdas.sh
          echo "Validating zip integrity..."
          for zip in lambda-packages/*.zip; do
            unzip -t "$zip" > /dev/null || exit 1
          done
          echo "All Lambda packages valid."

      # The half the local hook cannot cover: ~/.kiro/ is in nobody's checkout, so a
      # pull request opened from anywhere else would not be checked. Runs the gate's own
      # tests first, because a checker that reports success without evaluating its rules
      # is the same shape as the problem it exists to catch.
      - name: Check evidence for claims of vendor absence
        run: |
          pytest scripts/tests/ --tb=short -q
          python3 scripts/check_evidence_claims.py
      # Generic detection only (account IDs, public IPs, emails, home paths). No
      # SENSITIVE_PATTERNS secret is configured for this repository, so the
      # environment-specific list stays local in .sensitive-patterns.local.
      - name: Check tracked files for sensitive data
        run: python3 scripts/check_sensitive_patterns.py --tracked
      # Same two commands as `make check-supply-chain`, which `make test` runs. The selftest
      # comes first: every subcommand must be seen failing on its fixtures before a clean
      # result on the repository means anything. Offline by design; the SHA-existence check
      # (`make check-pinned-sha-exist`) needs a token and the network and is not run here.
      - name: Supply-chain gates (selftest, then the repository)
        run: |
          python3 scripts/check_supply_chain.py --selftest
          python3 scripts/check_supply_chain.py
      - name: Run pytest
        env:
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
        run: |
          pytest tests/ shared/tests/ -v --tb=short --cov=solutions --cov-report=term-missing --cov-fail-under=79 --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results.xml
