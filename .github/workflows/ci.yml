name: CI - Lint & Test

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'solutions/**'
      - 'shared/**'
      - 'tests/**'
      - 'security/guard-rules/**'
      - 'requirements*.txt'
      - '.cfnlintrc'
      - '.github/workflows/ci.yml'
      # The evidence gate reads tracked markdown. Without these, a documentation-only
      # pull request skipped the whole job, so the one change the gate exists to catch
      # -- a new claim of vendor absence in a document -- was the change it never saw.
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'solutions/**'
      - 'shared/**'
      - 'tests/**'
      - 'security/guard-rules/**'
      - 'requirements*.txt'
      - '.cfnlintrc'
      - '.github/workflows/ci.yml'
      # The evidence gate reads tracked markdown. Without these, a documentation-only
      # pull request skipped the whole job, so the one change the gate exists to catch
      # -- a new claim of vendor absence in a document -- was the change it never saw.
      - 'docs/**'
      - '**/*.md'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run cfn-lint
        run: cfn-lint templates/*.yaml

      - name: Run cfn-guard
        uses: aws-cloudformation/cloudformation-guard@0e1dc63f667c80e3b9ed1aea2ba1cf6c8d588298 # action-v0.0.5
        with:
          rules: 'security/guard-rules/'
          data: 'templates/'
          show-summary: 'fail'
          checkout: 'false'

      - name: Run ruff (Python linter)
        run: |
          ruff check solutions/ tests/ shared/ --output-format=github

      - name: Run Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r solutions/ -f json -o bandit-results.json || true

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --output json || true

      - name: Validate Lambda packaging
        run: |
          ./scripts/package-lambdas.sh
          echo "Validating zip integrity..."
          for zip in lambda-packages/*.zip; do
            unzip -t "$zip" > /dev/null || exit 1
          done
          echo "All Lambda packages valid."

      # The half the local hook cannot cover: ~/.kiro/ is in nobody's checkout, so a
      # pull request opened from anywhere else would not be checked. Runs the gate's own
      # tests first, because a checker that reports success without evaluating its rules
      # is the same shape as the problem it exists to catch.
      - name: Check evidence for claims of vendor absence
        run: |
          pytest scripts/tests/ --tb=short -q
          python3 scripts/check_evidence_claims.py
      - name: Run pytest
        env:
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
        run: |
          pytest tests/ shared/tests/ -v --tb=short --cov=solutions --cov-report=term-missing --cov-fail-under=79 --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results.xml
