AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  FSx for ONTAP Cyber Resilience - Event-Driven Response Stack.
  SQS queue, EventBridge custom bus, Step Functions workflows,
  Lambda functions, and SNS notification topics.

# -------------------------------------------------------------------
# Parameters
# -------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: fsxn-cyber-resilience
    Description: Project name.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email address for security alert notifications (optional).

  FallbackNotificationEmail:
    Type: String
    Default: ''
    Description: >
      Email address subscribed to the fallback alert topic (optional). The quarantine
      workflow publishes there when the primary alert fails, and the approval wait
      alarm notifies it. Use an address other than NotificationEmail.

  ApprovalWaitingAlarmThresholdSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 82800
    Description: >
      Age in seconds of the oldest message in the approval queue that raises the
      approval wait alarm. Must be shorter than the 24-hour approval timeout.

  ApprovalWebhookEndpoint:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://\S+$'
    Description: >
      HTTPS URL of a webhook that receives the state changes of the approval wait
      alarm through an EventBridge API destination (optional). Leave empty to create
      no webhook resources.

  ApprovalWebhookApiKeyName:
    Type: String
    Default: x-api-key
    AllowedPattern: '^[A-Za-z0-9-]{1,64}$'
    Description: Name of the HTTP header that carries the webhook API key.

  ApprovalWebhookApiKeyValue:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      API key sent in the header named by ApprovalWebhookApiKeyName. Required when
      ApprovalWebhookEndpoint is set. EventBridge stores it in a Secrets Manager
      secret that the connection creates.

  ApprovalWebhookKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      KMS key ARN for encrypting the Secrets Manager secret that the webhook connection creates.
      If empty, the secret keeps the AWS owned key (no customer managed key).
      The key must be a symmetric encryption key tagged EventBridgeApiDestinations=true.
      Without that tag the connection is created and shows AUTHORIZED, but every delivery
      fails and lands in the dead-letter queue.

  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages.

  LambdaArtifactPrefix:
    Type: String
    Default: lambda-packages
    Description: S3 key prefix for Lambda zip packages.

  EventTransformerS3Key:
    Type: String
    Description: S3 key for event-transformer Lambda zip (from package-lambdas.sh manifest).

  QuarantineActionS3Key:
    Type: String
    Description: S3 key for quarantine-action Lambda zip (from package-lambdas.sh manifest).

  LogGroupKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      KMS key ARN for encrypting the CloudWatch Logs log group created by this stack.
      If empty, the log group keeps the default CloudWatch Logs encryption (no customer managed key).
      The key policy must allow the CloudWatch Logs service principal for the Region.

  LambdaEnvKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      KMS key ARN for encrypting Lambda environment variables at rest.
      If empty, Lambda uses its default AWS managed key (aws/lambda).
      The identity that deploys the stack needs kms:CreateGrant and kms:Encrypt on this key.

# -------------------------------------------------------------------
# Conditions
# -------------------------------------------------------------------
Conditions:
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, '']]
  HasFallbackNotificationEmail: !Not [!Equals [!Ref FallbackNotificationEmail, '']]
  HasApprovalWebhook: !Not [!Equals [!Ref ApprovalWebhookEndpoint, '']]
  HasApprovalWebhookKmsKey: !Not [!Equals [!Ref ApprovalWebhookKmsKeyArn, '']]
  HasLogGroupKmsKey: !Not [!Equals [!Ref LogGroupKmsKeyArn, '']]
  HasLambdaEnvKmsKey: !Not [!Equals [!Ref LambdaEnvKmsKeyArn, '']]

# -------------------------------------------------------------------
# Rules
# -------------------------------------------------------------------
Rules:
  ApprovalWebhookNeedsApiKey:
    RuleCondition: !Not [!Equals [!Ref ApprovalWebhookEndpoint, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref ApprovalWebhookApiKeyValue, '']]
        AssertDescription: ApprovalWebhookApiKeyValue is required when ApprovalWebhookEndpoint is set.

# -------------------------------------------------------------------
# Resources
# -------------------------------------------------------------------
Resources:

  # ---------------------------------------------------------------
  # SQS - Event ingestion queue (buffer between FPolicy and EventBridge)
  # ---------------------------------------------------------------
  SecurityEventQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${ProjectName}-security-events-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SecurityEventDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

  SecurityEventDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${ProjectName}-security-events-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

  # ---------------------------------------------------------------
  # EventBridge - Custom event bus for security events
  # ---------------------------------------------------------------
  SecurityEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-security-${Environment}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Rule: Route malware detection events to quarantine workflow
  RuleQuarantine:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-quarantine-${Environment}'
      EventBusName: !Ref SecurityEventBus
      State: ENABLED
      EventPattern:
        source:
          - 'fsxn.cyber-resilience.fpolicy'
          - 'fsxn.cyber-resilience.arp'
        detail-type:
          - 'MalwareDetected'
          - 'RansomwareDetected'
      Targets:
        - Id: QuarantineWorkflow
          Arn: !Ref QuarantineStateMachine
          RoleArn: !GetAtt EventBridgeToStepFunctionsRole.Arn

  # Rule: Route all security events to notification
  RuleNotification:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-notify-${Environment}'
      EventBusName: !Ref SecurityEventBus
      State: ENABLED
      EventPattern:
        source:
          - prefix: 'fsxn.cyber-resilience'
      Targets:
        - Id: NotificationTopic
          Arn: !Ref SecurityAlertTopic

  # ---------------------------------------------------------------
  # SNS - Security alert notifications
  # ---------------------------------------------------------------
  # A CloudWatch alarm cannot notify a topic encrypted with the AWS managed key
  # aws/sns (alarm action fails, measured), because that key's policy cannot be
  # changed. The topic uses this customer managed key, whose policy lets alarms
  # and EventBridge rules in this account publish.
  AlertTopicKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub 'Encrypts the ${ProjectName} security alert topic (${Environment})'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowAlarmsAndRulesToPublish
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AlertTopicKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-alert-topic-${Environment}'
      TargetKeyId: !Ref AlertTopicKey

  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-security-alerts-${Environment}'
      KmsMasterKeyId: !GetAtt AlertTopicKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # The default topic policy lets no AWS service publish: the EventBridge rule
  # above delivered nothing without this policy (measured). IAM roles in this
  # account publish through their own identity policies.
  SecurityAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3037  # sns:Receive is a legacy topic-policy action absent from the linter's action list
    Properties:
      Topics:
        - !Ref SecurityAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountOwner
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'sns:Publish'
              - 'sns:Subscribe'
              - 'sns:Receive'
              - 'sns:GetTopicAttributes'
              - 'sns:SetTopicAttributes'
              - 'sns:AddPermission'
              - 'sns:RemovePermission'
              - 'sns:DeleteTopic'
              - 'sns:ListSubscriptionsByTopic'
            Resource: !Ref SecurityAlertTopic
          - Sid: AllowAlarmsAndRulesToPublish
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
            Action: 'sns:Publish'
            Resource: !Ref SecurityAlertTopic
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  SecurityAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      TopicArn: !Ref SecurityAlertTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # ---------------------------------------------------------------
  # SNS - Fallback alert path
  # ---------------------------------------------------------------
  # A second topic, with its own key, so that a fault in SecurityAlertTopic or
  # AlertTopicKey does not also stop the approval wait alarm and the workflow's
  # fallback notice. Both topics are SNS in the same Region, so a Regional SNS
  # outage stops both.
  AlertFallbackTopicKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub 'Encrypts the ${ProjectName} fallback alert topic (${Environment})'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AlertFallbackTopicKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-alert-fallback-topic-${Environment}'
      TargetKeyId: !Ref AlertFallbackTopicKey

  AlertFallbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alert-fallback-${Environment}'
      KmsMasterKeyId: !GetAtt AlertFallbackTopicKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  AlertFallbackTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3037  # sns:Receive is a legacy topic-policy action absent from the linter's action list
    Properties:
      Topics:
        - !Ref AlertFallbackTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountOwner
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'sns:Publish'
              - 'sns:Subscribe'
              - 'sns:Receive'
              - 'sns:GetTopicAttributes'
              - 'sns:SetTopicAttributes'
              - 'sns:AddPermission'
              - 'sns:RemovePermission'
              - 'sns:DeleteTopic'
              - 'sns:ListSubscriptionsByTopic'
            Resource: !Ref AlertFallbackTopic
          - Sid: AllowAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: 'sns:Publish'
            Resource: !Ref AlertFallbackTopic
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

  AlertFallbackEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasFallbackNotificationEmail
    Properties:
      TopicArn: !Ref AlertFallbackTopic
      Protocol: email
      Endpoint: !Ref FallbackNotificationEmail

  # ---------------------------------------------------------------
  # Step Functions - Quarantine Workflow
  # ---------------------------------------------------------------
  QuarantineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-quarantine-${Environment}'
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL
      DefinitionString: !Sub |
        {
          "Comment": "Quarantine workflow: isolate compromised volume, snapshot, notify",
          "StartAt": "CreateForensicSnapshot",
          "States": {
            "CreateForensicSnapshot": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::aws-sdk:fsx:createSnapshot",
              "Parameters": {
                "Name.$": "States.Format('forensic-{}', $.detail.timestamp)",
                "VolumeId.$": "$.detail.volumeId"
              },
              "ResultPath": "$.snapshot",
              "Next": "RestrictExportPolicy",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ]
            },
            "RestrictExportPolicy": {
              "Type": "Task",
              "Resource": "${QuarantineLambda.Arn}",
              "Parameters": {
                "action": "restrict_export_policy",
                "volumeId.$": "$.detail.volumeId",
                "svmId.$": "$.detail.svmId"
              },
              "ResultPath": "$.quarantine",
              "Next": "SendAlert",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ]
            },
            "SendAlert": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${SecurityAlertTopic}",
                "Subject": "CRITICAL: Security Event - Quarantine Executed",
                "Message.$": "States.Format('Volume {} quarantined. Severity: {}', $.detail.volumeId, $.detail.severity)"
              },
              "ResultPath": "$.alert",
              "Next": "WaitForApproval",
              "Retry": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.alertError",
                  "Next": "NotifyFallback"
                }
              ]
            },
            "NotifyFallback": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${AlertFallbackTopic}",
                "Subject": "CRITICAL: Quarantine Executed - Primary Alert Failed",
                "Message.$": "States.Format('Volume {} quarantined. Severity: {}. The primary security alert could not be sent. An approval request is waiting in the approval queue.', $.detail.volumeId, $.detail.severity)"
              },
              "ResultPath": "$.fallbackAlert",
              "Next": "WaitForApproval",
              "Retry": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.fallbackError",
                  "Next": "WaitForApproval"
                }
              ]
            },
            "WaitForApproval": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
              "Parameters": {
                "QueueUrl": "${ApprovalQueue}",
                "MessageBody": {
                  "taskToken.$": "$$.Task.Token",
                  "event.$": "$"
                }
              },
              "TimeoutSeconds": 86400,
              "ResultPath": "$.approval",
              "Next": "ApprovalDecision",
              "Catch": [
                {
                  "ErrorEquals": ["States.Timeout"],
                  "ResultPath": "$.error",
                  "Next": "EscalateTimeout"
                },
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ]
            },
            "ApprovalDecision": {
              "Type": "Choice",
              "Choices": [
                {
                  "And": [
                    { "Variable": "$.approval.approved", "IsPresent": true },
                    { "Variable": "$.approval.approved", "BooleanEquals": true }
                  ],
                  "Next": "RestoreAccess"
                },
                {
                  "And": [
                    { "Variable": "$.approval.approved", "IsPresent": true },
                    { "Variable": "$.approval.approved", "BooleanEquals": false }
                  ],
                  "Next": "CreateFlexClone"
                }
              ],
              "Default": "NotifyFailure"
            },
            "RestoreAccess": {
              "Type": "Task",
              "Resource": "${QuarantineLambda.Arn}",
              "Parameters": {
                "action": "restore_export_policy",
                "volumeId.$": "$.detail.volumeId",
                "svmId.$": "$.detail.svmId"
              },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ],
              "End": true
            },
            "CreateFlexClone": {
              "Type": "Task",
              "Resource": "${QuarantineLambda.Arn}",
              "Parameters": {
                "action": "create_forensic_clone",
                "volumeId.$": "$.detail.volumeId",
                "snapshotId.$": "$.snapshot.Snapshot.SnapshotId"
              },
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ],
              "End": true
            },
            "NotifyFailure": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${SecurityAlertTopic}",
                "Subject": "ERROR: Quarantine Workflow Failed",
                "Message": "Quarantine workflow failed. Manual intervention required. Check Step Functions execution history for details."
              },
              "Retry": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.notifyError",
                  "Next": "NotificationFailed"
                }
              ],
              "End": true
            },
            "EscalateTimeout": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${SecurityAlertTopic}",
                "Subject": "ESCALATION: Approval Timeout - Quarantined Volume",
                "Message": "Quarantine approval timed out after 24 hours. Volume remains quarantined."
              },
              "Retry": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.notifyError",
                  "Next": "NotificationFailed"
                }
              ],
              "End": true
            },
            "NotificationFailed": {
              "Type": "Fail",
              "Error": "NotificationFailed",
              "Cause": "The notification could not be published to the alert topic after retries. The volume may still be quarantined. Check the execution history and the alert topic."
            }
          }
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

  # ---------------------------------------------------------------
  # SQS - Approval queue (human-in-the-loop)
  # ---------------------------------------------------------------
  ApprovalQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${ProjectName}-approval-${Environment}'
      VisibilityTimeout: 900
      MessageRetentionPeriod: 345600
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------
  # SQS - Batch scan results (S3 AP TrendAI integration)
  # ---------------------------------------------------------------
  BatchScanResultQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${ProjectName}-batch-scan-results-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BatchScanResultDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

  BatchScanResultDlq:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${ProjectName}-batch-scan-results-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

  # SNS subscription policy allowing external scan result topics
  BatchScanResultQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref BatchScanResultQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt BatchScanResultQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:*:*scan*'

  # ---------------------------------------------------------------
  # Lambda - Quarantine actions (ONTAP REST API calls)
  # ---------------------------------------------------------------
  QuarantineLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: >-
              This function is invoked only from Step Functions Task states that name its ARN
              as Resource; the state waits for the function output, so no event is discarded
              by an asynchronous invocation. A Lambda dead-letter queue receives only events
              that an asynchronous invocation discards.
    Properties:
      FunctionName: !Sub '${ProjectName}-quarantine-action-${Environment}'
      Runtime: python3.12
      Handler: quarantine_action.handler
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Architectures:
        - arm64
      Role: !GetAtt QuarantineLambdaRole.Arn
      KmsKeyArn: !If [HasLambdaEnvKmsKey, !Ref LambdaEnvKmsKeyArn, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          FSX_SECRET_ARN: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-fsxadmin-*'
          ENVIRONMENT: !Ref Environment
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-SgLambdaId'
        SubnetIds:
          - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-SubnetCompute1Id'
          - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-SubnetCompute2Id'
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: !Sub '${LambdaArtifactPrefix}/${QuarantineActionS3Key}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

  # ---------------------------------------------------------------
  # Lambda - Event transformer (FPolicy → EventBridge)
  # ---------------------------------------------------------------
  EventTransformerLambda:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: >-
              This function is invoked only by SQS event source mappings, not asynchronously.
              AWS documents that, for SQS event sources, the dead-letter queue belongs on the
              source queue, and both source queues here have a RedrivePolicy.
          - id: CKV_AWS_117
            comment: >-
              The only outbound call is events:PutEvents to an EventBridge bus, an AWS public API.
              SQS is polled by the Lambda service, so no VPC path is needed to read the queues.
              The function reaches no private VPC resource. Placing it in a VPC would require
              an events interface endpoint or a NAT gateway, neither of which this stack creates.
    Properties:
      FunctionName: !Sub '${ProjectName}-event-transformer-${Environment}'
      Runtime: python3.12
      Handler: event_transformer.handler
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 50
      Architectures:
        - arm64
      Role: !GetAtt EventTransformerLambdaRole.Arn
      KmsKeyArn: !If [HasLambdaEnvKmsKey, !Ref LambdaEnvKmsKeyArn, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref SecurityEventBus
          ENVIRONMENT: !Ref Environment
      CodeUri:
        Bucket: !Ref LambdaArtifactBucket
        Key: !Sub '${LambdaArtifactPrefix}/${EventTransformerS3Key}'
      # Canary rollout: SAM publishes a version per deploy, moves alias "live" through
      # CodeDeploy, and rolls back when any listed alarm fires or the PreTraffic hook fails.
      # Two kinds of signal, because the function reports most failures without raising:
      # it returns batchItemFailures and writes FailedRecords (Embedded Metric Format), and
      # neither shows up in the AWS/Lambda Errors metric. Alarms on the alias alone mix in the
      # old version's traffic while the weights are 90/10, so the new version has its own
      # alarms (ExecutedVersion dimension). EventTransformerAliasErrorsAlarm counts the old
      # version too, so it only notifies and is not a rollback trigger. Not every rollback alarm
      # watches the alias: Errors and Duration use the alias plus ExecutedVersion, FailedRecords
      # is a custom metric (FunctionName + ExecutedVersion), Throttles is per function. Thresholds are not
      # measured yet (hypothesis).
      AutoPublishAlias: live
      DeploymentPreference:
        Type: Canary10Percent10Minutes
        Alarms:
          - !Ref EventTransformerNewVersionErrorsAlarm
          - !Ref EventTransformerNewVersionFailedRecordsAlarm
          - !Ref EventTransformerNewVersionDurationAlarm
          - !Ref EventTransformerThrottlesAlarm
        Hooks:
          PreTraffic: !Ref EventTransformerPreTrafficFunction
      RuntimeManagementConfig:
        UpdateRuntimeOn: FunctionUpdate
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Layer: event-driven
        Component: event-transformer

  # Errors on the "live" alias (old and new version together). Notification only: it is not in
  # DeploymentPreference.Alarms, because while the weights are 90/10 an error of the old version
  # would roll back a healthy new version. The rollback triggers are the new-version alarms below.
  # Counts only invocations that raise: timeouts, out-of-memory and uncaught exceptions. A handler
  # that returns batchItemFailures does not count here.
  EventTransformerAliasErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-event-transformer-alias-errors-${Environment}'
      AlarmDescription: Errors on the live alias of the event transformer (old and new version together); notification only, not a canary rollback trigger
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EventTransformerLambda
        - Name: Resource
          Value: !Sub '${EventTransformerLambda}:live'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SecurityAlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven
        - Key: Component
          Value: event-transformer
  # Errors of the newly published version only. While the alias is weighted 90/10 the old
  # version's errors stay out of this alarm. TreatMissingData is notBreaching because a
  # version that receives no traffic publishes no data; the PreTraffic hook is what exercises
  # the new version when no message arrives during the window.
  EventTransformerNewVersionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-event-transformer-new-version-errors-${Environment}'
      AlarmDescription: Errors of the newest event transformer version; canary rollback trigger
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EventTransformerLambda
        - Name: Resource
          Value: !Sub '${EventTransformerLambda}:live'
        - Name: ExecutedVersion
          Value: !GetAtt [EventTransformerLambda, Version.Version]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SecurityAlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven
        - Key: Component
          Value: event-transformer
  # Records the newest version returned to the queue (messages that did not transform, entries
  # EventBridge rejected). The handler writes this metric in Embedded Metric Format with
  # ExecutedVersion as a dimension. One failed record in a minute trips it. A malformed
  # message that reaches the new version trips it as well; that is a false positive the design
  # accepts, because a rollback costs a redeploy and a missed transformation failure costs events.
  EventTransformerNewVersionFailedRecordsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-event-transformer-new-version-failed-records-${Environment}'
      AlarmDescription: Records the newest event transformer version returned to the queue; canary rollback trigger
      Namespace: FsxnCyberResilience/EventTransformer
      MetricName: FailedRecords
      Dimensions:
        - Name: FunctionName
          Value: !Ref EventTransformerLambda
        - Name: ExecutedVersion
          Value: !GetAtt [EventTransformerLambda, Version.Version]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SecurityAlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven
        - Key: Component
          Value: event-transformer
  # A slower version raises no error until it reaches the 30 s timeout. 15000 ms is half of
  # Timeout; the normal duration has not been measured, so the value is a starting point.
  # Maximum, not p99: a minute holds few invocations and p99 of a handful is the maximum anyway.
  EventTransformerNewVersionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-event-transformer-new-version-duration-${Environment}'
      AlarmDescription: Duration of the newest event transformer version exceeds half of the function timeout; canary rollback trigger
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref EventTransformerLambda
        - Name: Resource
          Value: !Sub '${EventTransformerLambda}:live'
        - Name: ExecutedVersion
          Value: !GetAtt [EventTransformerLambda, Version.Version]
      Statistic: Maximum
      Unit: Milliseconds
      Period: 60
      EvaluationPeriods: 1
      Threshold: 15000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SecurityAlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven
        - Key: Component
          Value: event-transformer
  # Throttled requests are not counted in Invocations or Errors. A slow new version holds
  # concurrency (ReservedConcurrentExecutions is 50) and the event source mapping then
  # backs off, so the only visible effect would be delay. Throttles is read at function level;
  # whether the metric also exists per alias has not been checked.
  EventTransformerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-event-transformer-throttles-${Environment}'
      AlarmDescription: Throttled invocations of the event transformer; canary rollback trigger
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref EventTransformerLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SecurityAlertTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven
        - Key: Component
          Value: event-transformer
  # PreTraffic hook: CodeDeploy runs it before any traffic moves to the new version. It sends
  # one synthetic record with dry_run set (the handler transforms it and publishes nothing)
  # and reports Succeeded or Failed to CodeDeploy. This is the only check that runs when no
  # message arrives during the canary window. Name prefix CodeDeployHook_ matches the
  # lambda:InvokeFunction grant of the AWSCodeDeployRoleForLambda managed policy. A function
  # name is limited to 64 characters; with the default ProjectName and Environment
  # production it is 61.
  EventTransformerPreTrafficFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: >-
              CodeDeploy invokes this function once per deployment, and the function reports its
              result through the CodeDeploy API. The CodeDeploy documentation does not say whether
              the invocation is synchronous. It does say that a hook which reports nothing fails
              the deployment after one hour, so a lost invocation cannot pass unnoticed.
          - id: CKV_AWS_117
            comment: >-
              The function calls only the Lambda and CodeDeploy public APIs. This stack creates
              no endpoint or NAT gateway for them, so placing it in a VPC would break it.
    Properties:
      FunctionName: !Sub 'CodeDeployHook_${ProjectName}-et-pretraffic-${Environment}'
      Description: Canary PreTraffic hook; invokes the new event transformer version with a dry-run probe
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      ReservedConcurrentExecutions: 2
      Architectures:
        - arm64
      Role: !GetAtt EventTransformerPreTrafficRole.Arn
      KmsKeyArn: !If [HasLambdaEnvKmsKey, !Ref LambdaEnvKmsKeyArn, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          TARGET_VERSION_ARN: !Ref EventTransformerLambda.Version
      InlineCode: |
        import json
        import logging
        import os
        from typing import Any

        import boto3

        logger = logging.getLogger()
        logger.setLevel(logging.INFO)

        PROBE = {
            "dry_run": True,
            "Records": [
                {
                    "messageId": "canary-probe",
                    "body": json.dumps(
                        {
                            "source": "scanner",
                            "scanner_name": "canary",
                            "verdict": "CLEAN",
                            "file_path": "/canary-probe",
                            "timestamp": "2026-01-01T00:00:00Z",
                        }
                    ),
                }
            ],
        }


        def handler(event: dict[str, Any], context: Any) -> str:
            """Probes the new version and reports the result to CodeDeploy."""
            status = "Failed"
            try:
                response = boto3.client("lambda").invoke(
                    FunctionName=os.environ["TARGET_VERSION_ARN"],
                    Payload=json.dumps(PROBE).encode(),
                )
                result = json.loads(response["Payload"].read())
                if (
                    "FunctionError" not in response
                    and result.get("dry_run") is True
                    and result.get("validated") == 1
                    and not result.get("batchItemFailures")
                ):
                    status = "Succeeded"
                else:
                    logger.error("probe rejected: %s", json.dumps(result)[:500])
            except Exception:
                logger.exception("probe failed")
            boto3.client("codedeploy").put_lifecycle_event_hook_execution_status(
                deploymentId=event["DeploymentId"],
                lifecycleEventHookExecutionId=event["LifecycleEventHookExecutionId"],
                status=status,
            )
            return status
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        Layer: event-driven
        Component: event-transformer-pretraffic
  # A canary that rolls back leaves the stack in UPDATE_ROLLBACK_COMPLETE and the alias on the
  # old version. Nothing in the pipeline tells the operator unless something sends a message.
  # CodeDeploy publishes deployment state changes to EventBridge; FAILURE is an alarm or hook
  # rollback, STOP is a manual stop. The existing alert topic and key already accept
  # EventBridge, so the topic needs no change (a CodeDeploy trigger would publish with the
  # service role and need a grant on the topic's key).
  EventTransformerDeploymentFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-event-transformer-deployment-failed-${Environment}'
      Description: >-
        An event transformer canary deployment ended in FAILURE or STOP. The alias should be back
        on the previous version; confirm with aws lambda get-alias, describe-stacks and
        describe-alarms before deploying again.
      State: ENABLED
      EventPattern:
        source:
          - aws.codedeploy
        detail-type:
          - CodeDeploy Deployment State-change Notification
        detail:
          application:
            - !Ref ServerlessDeploymentApplication
          state:
            - FAILURE
            - STOP
      Targets:
        - Id: NotificationTopic
          Arn: !Ref SecurityAlertTopic
  # SQS → Lambda event source mapping
  EventTransformerMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SecurityEventQueue.Arn
      FunctionName: !Ref EventTransformerLambda.Alias
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      # The handler returns batchItemFailures; without this setting Lambda ignores the list
      # and deletes the whole batch (AWS Lambda Developer Guide, SQS error handling).
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true

  # Batch scan results SQS → Event Transformer (same handler, different source)
  BatchScanResultMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt BatchScanResultQueue.Arn
      FunctionName: !Ref EventTransformerLambda.Alias
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 30
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true

  # ---------------------------------------------------------------
  # CloudWatch Log Group for Step Functions
  # ---------------------------------------------------------------
  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/stepfunctions/${ProjectName}-quarantine-${Environment}'
      RetentionInDays: 90
      KmsKeyId: !If [HasLogGroupKmsKey, !Ref LogGroupKmsKeyArn, !Ref 'AWS::NoValue']
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------
  # DLQ Alarm
  # ---------------------------------------------------------------
  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-dlq-messages-${Environment}'
      AlarmDescription: Messages in security event DLQ indicate processing failures
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SecurityEventDlq.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------
  # Quarantine workflow failure alarm
  # ---------------------------------------------------------------
  # Counts executions that end in FAILED. States.Runtime errors are not caught
  # by any Catch in the definition, so a failure of that kind shows up here and
  # in the execution history only.
  QuarantineExecutionsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-quarantine-executions-failed-${Environment}'
      AlarmDescription: >-
        A quarantine workflow execution ended in FAILED. The volume may still be
        quarantined. Open the state machine execution history to find the failed
        state.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref QuarantineStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------
  # Approval wait alarm
  # ---------------------------------------------------------------
  # Fires when an approval request has waited longer than the threshold, whether
  # or not the primary alert was sent. It notifies both topics, so it still
  # reaches someone when SecurityAlertTopic is the part that failed.
  # The metric counts a message until it is deleted: reading it with
  # receive-message does not clear the alarm, so the runbook deletes the message
  # after send-task-success.
  ApprovalWaitingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-approval-waiting-${Environment}'
      AlarmDescription: >-
        A quarantine approval request has waited in the approval queue longer than
        the threshold. The volume stays quarantined until someone approves or
        rejects it, and the request times out after 24 hours. Delete the queue
        message after answering it.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ApprovalQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ApprovalWaitingAlarmThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertFallbackTopic
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------
  # Approval wait webhook (optional, HasApprovalWebhook)
  # ---------------------------------------------------------------
  # A path for the approval wait alarm that does not go through SNS. CloudWatch
  # sends every alarm state change to the default event bus; this rule forwards
  # the changes of ApprovalWaitingAlarm (ALARM and OK) to an API destination.
  # It helps when SNS fails. EventBridge and the alarm are in the same Region as
  # the topics, so a Regional EventBridge or CloudWatch outage stops this path too.
  # Delivery is retried on 401, 407, 409, 429 and 5xx responses for up to
  # 24 hours and 185 attempts. Other 4xx responses go to the dead-letter queue
  # without a retry.
  ApprovalWebhookConnection:
    Type: AWS::Events::Connection
    Condition: HasApprovalWebhook
    Properties:
      Name: !Sub '${ProjectName}-approval-webhook-${Environment}'
      Description: API key for the approval wait webhook
      AuthorizationType: API_KEY
      KmsKeyIdentifier: !If [HasApprovalWebhookKmsKey, !Ref ApprovalWebhookKmsKeyArn, !Ref 'AWS::NoValue']
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: !Ref ApprovalWebhookApiKeyName
          ApiKeyValue: !Ref ApprovalWebhookApiKeyValue

  ApprovalWebhookDestination:
    Type: AWS::Events::ApiDestination
    Condition: HasApprovalWebhook
    Properties:
      Name: !Sub '${ProjectName}-approval-webhook-${Environment}'
      Description: Webhook that receives approval wait alarm state changes
      ConnectionArn: !GetAtt ApprovalWebhookConnection.Arn
      InvocationEndpoint: !Ref ApprovalWebhookEndpoint
      HttpMethod: POST
      InvocationRateLimitPerSecond: 1

  ApprovalWebhookRuleRole:
    Type: AWS::IAM::Role
    Condition: HasApprovalWebhook
    Properties:
      RoleName: !Sub '${ProjectName}-approval-webhook-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: InvokeApprovalWebhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'events:InvokeApiDestination'
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:api-destination/${ApprovalWebhookDestination}/*'

  # SQS managed encryption (SSE-SQS) needs no KMS key policy for EventBridge.
  ApprovalWebhookDlq:
    Type: AWS::SQS::Queue
    Condition: HasApprovalWebhook
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_27
            comment: >-
              The queue is encrypted at rest with SQS managed encryption
              (SqsManagedSseEnabled: true). This check accepts only KmsMasterKeyId.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${ProjectName}-approval-webhook-dlq-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

  ApprovalWebhookDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: HasApprovalWebhook
    Properties:
      Queues:
        - !Ref ApprovalWebhookDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowApprovalWebhookRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sqs:SendMessage'
            Resource: !GetAtt ApprovalWebhookDlq.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !GetAtt ApprovalWebhookRule.Arn

  ApprovalWebhookRule:
    Type: AWS::Events::Rule
    Condition: HasApprovalWebhook
    Properties:
      Name: !Sub '${ProjectName}-approval-webhook-${Environment}'
      Description: Sends approval wait alarm state changes to the webhook
      State: ENABLED
      EventPattern:
        source:
          - aws.cloudwatch
        detail-type:
          - CloudWatch Alarm State Change
        resources:
          - !GetAtt ApprovalWaitingAlarm.Arn
      Targets:
        - Id: ApprovalWebhook
          Arn: !GetAtt ApprovalWebhookDestination.Arn
          RoleArn: !GetAtt ApprovalWebhookRuleRole.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 86400
            MaximumRetryAttempts: 185
          DeadLetterConfig:
            Arn: !GetAtt ApprovalWebhookDlq.Arn

  # An event in the dead-letter queue means the webhook rejected it or the
  # retries ran out. The alarm notifies both topics.
  ApprovalWebhookDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasApprovalWebhook
    Properties:
      AlarmName: !Sub '${ProjectName}-approval-webhook-dlq-${Environment}'
      AlarmDescription: >-
        An approval wait alarm state change was not delivered to the webhook. Read
        the ERROR_CODE and ERROR_MESSAGE attributes of the message in the
        dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ApprovalWebhookDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertFallbackTopic
        - !Ref SecurityAlertTopic
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------
  # IAM Roles
  # ---------------------------------------------------------------

  # EventBridge → Step Functions
  EventBridgeToStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-eb-to-sfn-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: InvokeStepFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'states:StartExecution'
                Resource: !Ref QuarantineStateMachine

  # Step Functions execution role
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-sfn-exec-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource:
                  - !GetAtt QuarantineLambda.Arn
              - Effect: Allow
                Action:
                  - 'sns:Publish'
                Resource:
                  - !Ref SecurityAlertTopic
                  - !Ref AlertFallbackTopic
              - Effect: Allow
                Action:
                  - 'kms:GenerateDataKey'
                  - 'kms:Decrypt'
                Resource:
                  - !GetAtt AlertTopicKey.Arn
                  - !GetAtt AlertFallbackTopicKey.Arn
              - Effect: Allow
                Action:
                  - 'sqs:SendMessage'
                Resource:
                  - !GetAtt ApprovalQueue.Arn
              - Effect: Allow
                Action:
                  - 'fsx:CreateSnapshot'
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:RequestedRegion': !Ref 'AWS::Region'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogDelivery'
                  - 'logs:GetLogDelivery'
                  - 'logs:UpdateLogDelivery'
                  - 'logs:DeleteLogDelivery'
                  - 'logs:ListLogDeliveries'
                  - 'logs:PutResourcePolicy'
                  - 'logs:DescribeResourcePolicies'
                  - 'logs:DescribeLogGroups'
                Resource: '*'

  # Quarantine Lambda role
  QuarantineLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-quarantine-lambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: QuarantinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-fsxadmin-*'
              - Effect: Allow
                Action:
                  - 'fsx:CreateSnapshot'
                  - 'fsx:CreateVolume'
                  - 'fsx:DescribeVolumes'
                  - 'fsx:DescribeFileSystems'
                  - 'fsx:DescribeStorageVirtualMachines'
                Resource: '*'
                Condition:
                  StringEquals:
                    'aws:RequestedRegion': !Ref 'AWS::Region'

  # Event Transformer Lambda role
  EventTransformerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-event-transformer-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: EventTransformerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                Resource:
                  - !GetAtt SecurityEventQueue.Arn
                  - !GetAtt BatchScanResultQueue.Arn
              - Effect: Allow
                Action:
                  - 'events:PutEvents'
                Resource:
                  - !GetAtt SecurityEventBus.Arn

  EventTransformerPreTrafficRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-event-transformer-pretraffic-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: EventTransformerPreTrafficPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource:
                  - !Sub '${EventTransformerLambda.Arn}:*'
              - Effect: Allow
                Action:
                  - 'codedeploy:PutLifecycleEventHookExecutionStatus'
                # The deployment group is created by SAM with a generated name, and
                # the action is called with a deployment ID, so the ARN is not known here.
                Resource: '*'

# -------------------------------------------------------------------
# Outputs
# -------------------------------------------------------------------
Outputs:
  SecurityEventQueueUrl:
    Description: SQS Queue URL for security events
    Value: !Ref SecurityEventQueue
    Export:
      Name: !Sub '${ProjectName}-${Environment}-SecurityEventQueueUrl'

  ApprovalQueueUrl:
    Description: SQS Queue URL that receives the quarantine approval request and its task token
    Value: !Ref ApprovalQueue
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ApprovalQueueUrl'

  SecurityEventQueueArn:
    Description: SQS Queue ARN
    Value: !GetAtt SecurityEventQueue.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-SecurityEventQueueArn'

  SecurityEventBusName:
    Description: EventBridge custom bus name
    Value: !Ref SecurityEventBus
    Export:
      Name: !Sub '${ProjectName}-${Environment}-SecurityEventBusName'

  SecurityAlertTopicArn:
    Description: SNS topic for security alerts
    Value: !Ref SecurityAlertTopic
    Export:
      Name: !Sub '${ProjectName}-${Environment}-SecurityAlertTopicArn'

  AlertTopicKeyArn:
    Description: KMS key that encrypts the security alert topic. A role that publishes to the topic needs kms:GenerateDataKey and kms:Decrypt on it
    Value: !GetAtt AlertTopicKey.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlertTopicKeyArn'

  AlertFallbackTopicArn:
    Description: SNS topic for the fallback alert path (failed primary alert, approval waiting too long)
    Value: !Ref AlertFallbackTopic
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlertFallbackTopicArn'

  ApprovalWebhookDlqUrl:
    Condition: HasApprovalWebhook
    Description: SQS queue URL that holds approval wait alarm events the webhook did not accept
    Value: !Ref ApprovalWebhookDlq

  QuarantineStateMachineArn:
    Description: Quarantine workflow state machine ARN
    Value: !Ref QuarantineStateMachine
    Export:
      Name: !Sub '${ProjectName}-${Environment}-QuarantineStateMachineArn'

  BatchScanResultQueueUrl:
    Description: SQS Queue URL for S3 AP batch scan results
    Value: !Ref BatchScanResultQueue
    Export:
      Name: !Sub '${ProjectName}-${Environment}-BatchScanResultQueueUrl'

  BatchScanResultQueueArn:
    Description: SQS Queue ARN for batch scan results
    Value: !GetAtt BatchScanResultQueue.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-BatchScanResultQueueArn'
