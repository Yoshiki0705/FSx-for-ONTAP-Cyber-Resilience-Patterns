AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FSx for ONTAP Cyber Resilience Patterns - Root Stack.
  Orchestrates nested stacks for network, storage, scanning, event-driven response,
  observability, and data protection layers.

# -------------------------------------------------------------------
# Parameters
# -------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: fsxn-cyber-resilience
    Description: Project name used for resource naming and tagging.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production
    Description: Deployment environment.

  TemplatesBucketName:
    Type: String
    Description: S3 bucket containing nested stack templates.

  TemplatesPrefix:
    Type: String
    Default: templates/
    Description: S3 key prefix for nested stack templates.

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First availability zone.

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second availability zone.

  FsxAdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 50
    Description: Password for the fsxadmin user (passed to the Storage stack).

  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing the Lambda packages (passed to the Event-Driven stack).

  LambdaArtifactPrefix:
    Type: String
    Default: lambda-packages
    Description: S3 key prefix for the Lambda packages (passed to the Event-Driven stack).

  EventTransformerS3Key:
    Type: String
    Description: S3 key of the event-transformer package, from the package-lambdas.sh manifest.

  QuarantineActionS3Key:
    Type: String
    Description: S3 key of the quarantine-action package, from the package-lambdas.sh manifest.

  NotificationEmail:
    Type: String
    Default: ''
    Description: Email for security alert notifications (passed to Event-Driven stack).

  FallbackNotificationEmail:
    Type: String
    Default: ''
    Description: >
      Email subscribed to the fallback alert topic (passed to the Event-Driven stack).
      Use an address other than NotificationEmail.

  ApprovalWaitingAlarmThresholdSeconds:
    Type: Number
    Default: 3600
    MinValue: 300
    MaxValue: 82800
    Description: Age of the oldest approval request that raises the approval wait alarm (passed to the Event-Driven stack).

  ApprovalWebhookEndpoint:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://\S+$'
    Description: HTTPS webhook for approval wait alarm state changes (passed to the Event-Driven stack). Empty creates no webhook.

  ApprovalWebhookApiKeyName:
    Type: String
    Default: x-api-key
    AllowedPattern: '^[A-Za-z0-9-]{1,64}$'
    Description: HTTP header that carries the webhook API key (passed to the Event-Driven stack).

  ApprovalWebhookApiKeyValue:
    Type: String
    Default: ''
    NoEcho: true
    Description: Webhook API key, required when ApprovalWebhookEndpoint is set (passed to the Event-Driven stack).

  ApprovalWebhookKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      KMS key ARN for the Secrets Manager secret of the webhook connection (passed to the Event-Driven stack).
      If empty, the secret keeps the AWS owned key. A key must be symmetric and tagged EventBridgeApiDestinations=true.

  LogGroupKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      KMS key ARN for encrypting CloudWatch Logs log groups in the Network and Event-Driven stacks.
      If empty, the log groups keep the default CloudWatch Logs encryption.

  LambdaEnvKmsKeyArn:
    Type: String
    Default: ''
    Description: >
      KMS key ARN for encrypting Lambda environment variables in the Event-Driven stack.
      If empty, Lambda uses its default AWS managed key (aws/lambda).

# -------------------------------------------------------------------
# Rules
# -------------------------------------------------------------------
# The Event-Driven stack has the same rule. Checking it here makes the root
# stack fail at creation, before any nested stack is created. CloudFormation
# evaluates Rules at create-stack, not at create-change-set (measured).
Rules:
  ApprovalWebhookNeedsApiKey:
    RuleCondition: !Not [!Equals [!Ref ApprovalWebhookEndpoint, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref ApprovalWebhookApiKeyValue, '']]
        AssertDescription: ApprovalWebhookApiKeyValue is required when ApprovalWebhookEndpoint is set.

# -------------------------------------------------------------------
# Resources
# -------------------------------------------------------------------
Resources:

  # ---------------------------------------------------------------
  # Network Stack
  # ---------------------------------------------------------------
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatesPrefix}network.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        AvailabilityZone1: !Ref AvailabilityZone1
        AvailabilityZone2: !Ref AvailabilityZone2
        LogGroupKmsKeyArn: !Ref LogGroupKmsKeyArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: network

  # ---------------------------------------------------------------
  # Storage Stack
  # ---------------------------------------------------------------
  StorageStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatesPrefix}storage.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        FsxAdminPassword: !Ref FsxAdminPassword
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: storage-native

  # ---------------------------------------------------------------
  # Event-Driven Response Stack
  # ---------------------------------------------------------------
  EventDrivenStack:
    Type: AWS::CloudFormation::Stack
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatesPrefix}event-driven.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        LambdaArtifactBucket: !Ref LambdaArtifactBucket
        LambdaArtifactPrefix: !Ref LambdaArtifactPrefix
        EventTransformerS3Key: !Ref EventTransformerS3Key
        QuarantineActionS3Key: !Ref QuarantineActionS3Key
        NotificationEmail: !Ref NotificationEmail
        FallbackNotificationEmail: !Ref FallbackNotificationEmail
        ApprovalWaitingAlarmThresholdSeconds: !Ref ApprovalWaitingAlarmThresholdSeconds
        ApprovalWebhookEndpoint: !Ref ApprovalWebhookEndpoint
        ApprovalWebhookApiKeyName: !Ref ApprovalWebhookApiKeyName
        ApprovalWebhookApiKeyValue: !Ref ApprovalWebhookApiKeyValue
        ApprovalWebhookKmsKeyArn: !Ref ApprovalWebhookKmsKeyArn
        LogGroupKmsKeyArn: !Ref LogGroupKmsKeyArn
        LambdaEnvKmsKeyArn: !Ref LambdaEnvKmsKeyArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Layer
          Value: event-driven

# -------------------------------------------------------------------
# Outputs
# -------------------------------------------------------------------
Outputs:
  NetworkStackId:
    Description: Network nested stack ID
    Value: !Ref NetworkStack

  StorageStackId:
    Description: Storage nested stack ID
    Value: !Ref StorageStack

  EventDrivenStackId:
    Description: Event-Driven nested stack ID
    Value: !Ref EventDrivenStack

  VpcId:
    Description: VPC ID from Network Stack
    Value: !GetAtt NetworkStack.Outputs.VpcId
