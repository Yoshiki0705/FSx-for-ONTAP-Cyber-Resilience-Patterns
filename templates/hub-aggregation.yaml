AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FSx for ONTAP Cyber Resilience - Hub Aggregation (Phase 3).
  Central security monitoring account: aggregated EventBridge bus
  with cross-account receive policy for spoke accounts.

Parameters:
  ProjectName:
    Type: String
    Default: fsxn-cyber-resilience

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, production]

  OrganizationId:
    Type: String
    Default: ''
    Description: >
      AWS Organization ID (o-xxxxxxxxxx) to allow all member accounts.
      If empty, use SpokeAccountIds for explicit account list.

  SpokeAccountIds:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Comma-separated list of spoke account IDs allowed to send events.
      Used when OrganizationId is not provided.

Conditions:
  UseOrganization: !Not [!Equals [!Ref OrganizationId, '']]

Resources:

  # Central EventBridge bus for aggregated security events
  HubEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${ProjectName}-hub-${Environment}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Layer
          Value: observability

  # Policy allowing spoke accounts to put events
  HubEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref HubEventBus
      StatementId: AllowSpokeAccounts
      Action: events:PutEvents
      Principal: '*'
      Condition:
        Type: StringEquals
        Key: 'aws:PrincipalOrgID'
        Value: !If
          - UseOrganization
          - !Ref OrganizationId
          - !Ref 'AWS::NoValue'

  # Route aggregated events to notification
  HubNotificationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-hub-notify-${Environment}'
      EventBusName: !Ref HubEventBus
      State: ENABLED
      EventPattern:
        source:
          - prefix: 'fsxn.cyber-resilience'
        detail-type:
          - MalwareDetected
          - RansomwareDetected
      Targets:
        - Id: HubAlertTopic
          Arn: !Ref HubAlertTopic

  # An EventBridge rule delivered nothing to a topic encrypted with the AWS
  # managed key aws/sns, even with a topic policy that allows EventBridge
  # (measured). The topic uses this customer managed key, whose policy lets
  # EventBridge in this account publish.
  HubAlertTopicKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub 'Encrypts the ${ProjectName} hub alert topic (${Environment})'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowRulesToPublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
            Resource: '*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  HubAlertTopicKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-hub-alert-topic-${Environment}'
      TargetKeyId: !Ref HubAlertTopicKey

  # Hub SNS topic for aggregated alerts
  HubAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-hub-alerts-${Environment}'
      KmsMasterKeyId: !GetAtt HubAlertTopicKey.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # The default topic policy lets no AWS service publish, so the rule above
  # delivered nothing without this policy (measured).
  HubAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref HubAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountOwner
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'sns:Publish'
              - 'sns:Subscribe'
              - 'sns:Receive'
              - 'sns:GetTopicAttributes'
              - 'sns:SetTopicAttributes'
              - 'sns:AddPermission'
              - 'sns:RemovePermission'
              - 'sns:DeleteTopic'
              - 'sns:ListSubscriptionsByTopic'
            Resource: !Ref HubAlertTopic
          - Sid: AllowRulesToPublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sns:Publish'
            Resource: !Ref HubAlertTopic
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

Outputs:
  HubEventBusArn:
    Description: Hub EventBridge bus ARN (provide to spoke templates)
    Value: !GetAtt HubEventBus.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HubEventBusArn'

  HubEventBusName:
    Description: Hub EventBridge bus name
    Value: !Ref HubEventBus
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HubEventBusName'

  HubAlertTopicArn:
    Description: Hub SNS topic for aggregated security alerts
    Value: !Ref HubAlertTopic

  HubAlertTopicKeyArn:
    Description: KMS key that encrypts the hub alert topic. An identity that publishes to the topic needs kms:GenerateDataKey and kms:Decrypt on it
    Value: !GetAtt HubAlertTopicKey.Arn
